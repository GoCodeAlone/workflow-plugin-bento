version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: workflow-plugin-bento
    main: ./cmd/workflow-plugin-bento
    binary: workflow-plugin-bento
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/GoCodeAlone/workflow-plugin-bento/internal.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    files:
      - plugin.json
      - plugin.contracts.json
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc

release:
  draft: true
